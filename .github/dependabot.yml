version: 2

# Grouped aggressively on purpose. Ungrouped, this repo has four ecosystems and
# would open a dozen PRs a week, which is how a maintainer learns to ignore
# Dependabot entirely — and then misses the one update that mattered.
updates:
  - package-ecosystem: pub
    directories:
      - /
      - /apps/commy
      - /packages/commy_config
      - /packages/commy_core
      - /packages/commy_data
      - /packages/commy_domain
      - /packages/commy_ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      dart-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'
    # build_runner >= 2.15.2 needs analyzer >= 13.3.0 needs meta ^1.18.3, and
    # Flutter 3.44.8 pins meta 1.18.0. Until FLUTTER_VERSION in the workflows
    # moves, every such bump makes the workspace unresolvable (it did once:
    # PR #9 turned CI red for two days). Drop this entry with the Flutter bump.
    ignore:
      - dependency-name: build_runner
        versions: ['>=2.15.2']
      # Same story: very_good_analysis 11 declares `sdk: ^3.13.0`, and Flutter
      # 3.44.8 ships Dart 3.12.2. Seven identical pull requests (#16-#22) were
      # unresolvable for that reason alone. Drop this entry with the Flutter bump.
      - dependency-name: very_good_analysis
        versions: ['>=11.0.0']
      # melos 7 dropped melos.yaml for a `melos:` block inside the root pubspec
      # and moved bootstrap onto Dart pub workspaces. melos.yaml says the 6.x
      # pin is deliberate: taking that major is a repo-wide migration — every
      # package pubspec, both workflows, CONTRIBUTING — and not a bump anyone
      # can review as one. PR #12 was closed for that reason. Drop this entry
      # when the migration is its own pull request.
      - dependency-name: melos
        versions: ['>=7.0.0']

  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps)'
    # Rule R8: the network core is never bumped in passing. A sing-box update is
    # its own pull request with its own matrix run and its own reading of the
    # changelog, because it changes what happens to every user's traffic.
    ignore:
      - dependency-name: github.com/sagernet/sing-box
      # Same rule, same reason. These three are not dependencies of ours in any
      # sense that matters: they are the versions sing-box v1.13.16 was built
      # and tested with, and go.mod lists them as direct only because core/xhttp
      # imports the packages by name. Moved on their own they would put the core
      # on a combination nobody upstream ever ran. They move with sing-box.
      - dependency-name: github.com/sagernet/sing
      - dependency-name: github.com/sagernet/quic-go
      - dependency-name: golang.org/x/net

  - package-ecosystem: gradle
    directory: /apps/commy/android
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'

name: Release

# Fires on a version tag. Builds the core, builds signed Android artifacts, and
# publishes a GitHub Release with checksums.
#
# Signing is optional on purpose. Without the secrets the job still produces an
# installable APK, signed with the debug key and named so that nobody mistakes it
# for a release build. A project that cannot cut a release until someone uploads
# a keystore is a project that does not cut releases.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (must already exist)
        required: true

# Read-only unless a job says otherwise, and only `publish` does. The android
# job runs third-party actions, Gradle plugins and the build steps of pub
# packages next to the release key; a token that can push to the repository
# and edit releases has no business there. Third-party actions are pinned to
# a commit for the same reason (docs/08, "Кто видит ключ").
permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.8
  NDK_VERSION: 28.0.13004108
  # The tag being released, resolved once and used for everything: what is
  # checked out, what the files are called, which CHANGELOG section becomes
  # the notes, and which release they go to. A manual run takes it from the
  # input, not from the ref the run was started from: that ref is a branch
  # whenever this file had to be fixed after the tag was pushed, and a branch
  # name is neither a version nor something a release can hang on.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      certificate: ${{ steps.certificate.outputs.sha256 }}
    steps:
      # persist-credentials: false, or the token stays in .git/config for
      # every later step to read. Nothing here fetches or pushes after this.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      # Before anything is built. The file on the releases page is named after
      # the tag, but the version inside the app — in About, in backups, in the
      # User-Agent every panel sees — and its versionCode come from `version:`
      # in pubspec.yaml, and the notes from CHANGELOG.md. A tag pushed one
      # commit early would ship commy-X.apk that calls itself W, with notes
      # that say only "see the changelog". Seconds here, not half an hour on.
      - name: Check the tag against pubspec.yaml and CHANGELOG.md
        run: |
          v="${TAG#v}"
          if [ "$v" = "$TAG" ]; then
            echo "::error::$TAG is not a version tag (vX.Y.Z)"
            exit 1
          fi
          pv="$(sed -n 's/^version: *//p' apps/commy/pubspec.yaml)"
          if [ "${pv%%+*}" != "$v" ]; then
            echo "::error::the tag is $TAG, but apps/commy/pubspec.yaml says version: $pv"
            exit 1
          fi
          if ! awk -v ver="## [$v]" 'index($0, ver) == 1 {found=1} END {exit !found}' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no \"## [$v]\" section to take the notes from"
            exit 1
          fi
          echo "ok: $TAG is version $pv, with notes"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install NDK
        run: sdkmanager --install "ndk;${NDK_VERSION}"

      - name: Build libbox.aar
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: scripts/build_core.sh android

      - run: |
          dart pub get
          dart pub global activate melos 6.3.3
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - run: melos bootstrap
      - run: melos run gen --no-select

      # Only now, with codegen done: `melos bootstrap` and build_runner run
      # code from pub packages, and none of it needs the key. From here the
      # key is on disk for the two Gradle builds, and is removed after them.
      - name: Set up signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets configured — building an UNSIGNED release."
            echo "Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,"
            echo "ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to publish a signed build."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/commy.jks"
          cat > apps/commy/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/commy.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # The bundle goes first, and the order is load-bearing. ABI splits and app
      # bundles cannot both be on: with resource shrinking enabled R8 writes one
      # shrunk-resources file per split, and `bundleRelease` then finds four
      # where it expects one (https://issuetracker.google.com/402800800). The
      # split is switched off for bundle tasks in app/build.gradle.kts, but
      # building the bundle first also keeps the APK steps from leaving those
      # four files behind for it to trip over.
      - name: Build app bundle
        working-directory: apps/commy
        run: flutter build appbundle --release

      # One APK, because one file is what a releases page should offer: three
      # per-ABI files left people guessing which to take (owner's decision,
      # 2026-09-18). Built for the two ABIs phones have; the Gradle build
      # packages native libraries for those and nothing for x86_64 (rule R11).
      - name: Build the APK
        working-directory: apps/commy
        run: flutter build apk --release --target-platform android-arm,android-arm64

      # Nothing after this needs the key: the certificate is read back from the
      # APK. `always()`, so that a failed build does not leave it on disk for
      # what still runs after it, the actions' post-steps included.
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/commy.jks" apps/commy/android/key.properties

      # Before anything is collected: a release that outgrew its budget should
      # fail here, with the largest entries listed, not on somebody's phone.
      - name: Hold the APKs to their size budget
        run: scripts/check_apk_size.sh

      # Gradle happily produces an APK with no native library in it. That
      # installs, opens, and cannot connect to anything — the worst possible
      # failure to ship, because it looks like a working release.
      - name: Verify the artifacts carry the core
        working-directory: apps/commy
        run: |
          out=build/app/outputs/flutter-apk
          for apk in "$out"/app-release.apk; do
            [ -f "$apk" ] || continue
            abi=$(basename "$apk")
            # The underscore matters: the ABI directory is `x86_64`, and a
            # character class without `_` can never match it. The first run
            # that got this far reported "app-x86_64-release.apk ships without
            # the sing-box core" for an APK that carried it perfectly well.
            if ! unzip -l "$apk" | grep -qE 'lib/[a-z0-9_-]+/libbox\.so'; then
              echo "::error::$abi ships without the sing-box core"
              exit 1
            fi
            echo "ok: $abi $(du -h "$apk" | cut -f1)"
          done

      - name: Collect and checksum
        run: |
          mkdir -p dist
          v="${TAG#v}"
          suffix=""
          [ "${{ steps.signing.outputs.signed }}" = "true" ] || suffix="-UNSIGNED"
          out=apps/commy/build/app/outputs
          cp "$out/flutter-apk/app-release.apk" "dist/commy-${v}${suffix}.apk"
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # The fingerprint a user compares with `apksigner verify --print-certs`
      # (docs/08). Read from the APK itself, so the notes can never name a
      # key the file was not signed with. Not fatal: a missing line in the
      # notes is not worth a failed release.
      - name: Read the signing certificate
        id: certificate
        if: steps.signing.outputs.signed == 'true'
        run: |
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          sha="$("$tools/apksigner" verify --print-certs dist/*.apk 2>/dev/null \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)" || true
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "certificate SHA-256: ${sha:-unknown}"

      # Not release assets. An .aab does not install on a phone and an .aar is
      # a library; on the releases page both were two more files to pick the
      # wrong one from. They stay available here, on the workflow run.
      - name: Collect what is not for end users
        run: |
          mkdir -p extras
          v="${TAG#v}"
          out=apps/commy/build/app/outputs
          [ -f "$out/bundle/release/app-release.aab" ] && \
            cp "$out/bundle/release/app-release.aab" "extras/commy-${v}.aab"
          cp apps/commy/android/app/libs/libbox.aar "extras/libbox-${v}.aar"

      - uses: actions/upload-artifact@v7
        with:
          name: android-extras
          path: extras/
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: android
    runs-on: ubuntu-latest
    # The one job that writes: it creates the release and uploads to it. The
    # release action gets the token as its own input, so the checkout does
    # not need to leave it behind.
    permissions:
      contents: write
    steps:
      # The tag, not the ref of the run: the notes are the CHANGELOG of the
      # version being released.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: android-release
          path: dist

      - name: Extract the notes for this version from CHANGELOG.md
        id: notes
        run: |
          v="${TAG#v}"
          {
            if [ -f CHANGELOG.md ] && grep -q "## \[$v\]" CHANGELOG.md; then
              # A literal match, not a regex: awk turns "\\[" into "[", and
              # "[0.1.0-alpha.6]" is then a character class whose range 0-a
              # takes in "[" — every "## [" heading matched it, the exit rule
              # never ran, and each release carried the whole changelog.
              awk -v ver="## [$v]" '
                index($0, ver) == 1 {found=1; next}
                found && /^## \[/ {exit}
                found {print}
              ' CHANGELOG.md
            else
              echo "See CHANGELOG.md for details."
            fi
            # Short on purpose: the owner asked for release notes a person
            # reads to the end. One line each for the two things a download
            # needs to know.
            echo
            if [ "${{ needs.android.outputs.signed }}" != "true" ]; then
              echo '> Not signed with a release key: remove the previous version first.'
            elif [ -n "${{ needs.android.outputs.certificate }}" ]; then
              echo '> Signing certificate SHA-256: `${{ needs.android.outputs.certificate }}`'
            fi
            echo '> Checksum: `sha256sum -c SHA256SUMS.txt --ignore-missing`'
          } > release-notes.md
          cat release-notes.md

      # Named explicitly: left to itself the action takes github.ref, which on
      # a manual run is the branch it was started from.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(env.TAG, '-') }}
          fail_on_unmatched_files: true

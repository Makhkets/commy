name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published advisory is caught even when the repo is quiet.
    - cron: '31 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Go only.
        #
        # Dart is not a CodeQL language — commy_* is covered by the analyzer,
        # 724 tests and the two contract checks in ci.yml instead.
        #
        # Kotlin is deliberately absent. CodeQL cannot extract it in `none`
        # mode here ("detected code written in Java/Kotlin but could not
        # process any of it"), and the alternative is a manual build mode that
        # compiles the whole Android app inside the CodeQL harness: libbox.aar,
        # Flutter, Gradle, the lot. That doubles the slowest job in CI to scan
        # ~22 files of platform glue that hold no protocol logic by design
        # (docs/02-architecture.md). A permanently red check is worse than an
        # absent one, because people stop reading the red.
        #
        # What does cover that surface: review, `scripts/check_wire_contract.py`
        # and the PlatformInterface diff, both of which run on every push.
        include:
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@v7

      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

name: commy
description: >-
  Commy — a cross-platform proxy client for servers you own. Composition root,
  routing and screens. Application id and namespace: dev.commy.app.
version: 0.1.0-alpha.3+3
publish_to: none

environment:
  flutter: '>=3.22.0'
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  commy_config:
    path: ../../packages/commy_config
  commy_core:
    path: ../../packages/commy_core
  commy_data:
    path: ../../packages/commy_data
  commy_domain:
    path: ../../packages/commy_domain
  commy_ui:
    path: ../../packages/commy_ui
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Riverpod 3 without riverpod_generator: providers are declared by hand.
  # See docs/adr/0006-codegen-and-native-layout.md.
  flutter_riverpod: ^3.4.3
  go_router: '>=14.0.0 <18.0.0'
  mobile_scanner: ^7.0.0
  package_info_plus: '>=8.0.0 <11.0.0'
  share_plus: '>=11.0.0 <14.0.0'
  slang: ^4.19.1
  slang_flutter: ^4.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  # Pinned below 2.15.2 on purpose: from there build_runner needs analyzer
  # >= 13.3.0, which needs meta ^1.18.3, and Flutter 3.44.8 (.fvmrc, CI)
  # pins meta 1.18.0. Raising this without raising Flutter makes the whole
  # workspace unresolvable. Dependabot is told the same in .github/dependabot.yml.
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  slang_build_runner: ^4.0.0
  very_good_analysis: '>=6.0.0 <11.0.0'

flutter:
  uses-material-design: true
  # The translation sources. They are bundled rather than read from disk at
  # build time only because slang's runtime `overrides` feature and the
  # analyzer both expect the directory to exist; the generated Dart in
  # lib/gen is what actually ships the strings.
  assets:
    - assets/i18n/

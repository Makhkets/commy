org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Parallel execution is OFF. On two cores it buys almost nothing, and it
# multiplies the chance that two tasks touch the same file at once — which on
# Windows is not a race that resolves itself but a hard
#   Could not delete '...\kotlin\compileDebugKotlin\cacheable\caches-jvm'
# because another process still holds the handle.
org.gradle.parallel=false

# The Gradle build cache is OFF, and on Windows that is not a preference.
# Packing a task's output tree calls stat() for a POSIX file mode that NTFS does
# not have, and the build dies at the very end of a fifteen-minute run with
#   Could not pack tree 'RClassOutputJar': Could not get file mode for R.jar
# The incremental build still works; only cross-build reuse is given up.
org.gradle.caching=false

android.useAndroidX=true

# These two put the whole build on the *classic* Kotlin plugin rather than the
# Kotlin support built into AGP 9. Our own scripts need `newDsl=false` (they use
# BaseExtension / AppExtension), and the two settings have to agree.
#
# The pub dependency set straddles the AGP 9 migration and cannot be made
# consistent by choosing the other side, which is worth writing down because
# "just modernise it" is the obvious and wrong next idea:
#
#   * Plugins like mobile_scanner still do `apply plugin:
#     'org.jetbrains.kotlin.android'` unconditionally. With built-in Kotlin ON
#     that is a hard error — "no longer required for Kotlin support since
#     AGP 9.0" — thrown while applying com.android.library.
#
#   * file_picker 11 does the opposite: it detects AGP 9 and applies no Kotlin
#     plugin at all, expecting AGP to compile Kotlin. With built-in Kotlin OFF
#     nothing compiles its src/main/kotlin, :file_picker:compileDebugKotlin
#     never appears in the task list, the library builds empty, and the failure
#     surfaces two modules away as
#         GeneratedPluginRegistrant.java:19: cannot find symbol
#             new com.mr.flutter.plugin.filepicker.FilePickerPlugin()
#     which reads like a corrupt pub cache rather than a Gradle property.
#
# So: classic plugin everywhere, and build.gradle.kts applies it by hand to the
# subprojects that opted out. See the note there.
android.newDsl=false
android.builtInKotlin=false
# libbox.so is large; without this the R8/dex step on a small machine runs out.
android.enableR8.fullMode=false

# Kotlin incremental compilation is OFF on this project, and the reason is
# Windows rather than taste. The incremental compiler keeps a `caches-jvm`
# directory per module and rewrites it on every run; if anything else holds a
# handle to a file inside — an indexer, a virus scanner, a Kotlin daemon that
# has not exited — the task fails with
#   Could not delete '...\kotlin\compileDebugKotlin\cacheable\caches-jvm'
# and it does so several modules at a time, nine minutes into the build.
# A clean build directory does not help: the directory is created and deleted
# by the very build that then trips over it.
kotlin.incremental=false

# Compile in the Gradle process instead of spawning a Kotlin daemon. One fewer
# JVM holding file handles, and on a two-core machine the daemon's warm-start
# advantage is smaller than the memory it costs.
kotlin.compiler.execution.strategy=in-process
